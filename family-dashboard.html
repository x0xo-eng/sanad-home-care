<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>لوحة العائلة | سند</title>

  <link rel="stylesheet" href="style.css">

  <style>

    body {
      background: #f7fbfa;
    }

    /* =========================
       DASHBOARD
    ========================= */

    .dashboard {
      padding: 45px 7% 80px;
      max-width: 1250px;
      margin: auto;
    }


    /* =========================
       WELCOME
    ========================= */

    .welcome {
      background: linear-gradient(135deg, #16877d, #0f7068);
      color: white;
      border-radius: 28px;
      padding: 32px;
      margin-bottom: 25px;
      box-shadow: 0 20px 50px rgba(22,135,125,.18);
    }

    .welcome-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .welcome small {
      color: #c8e8e4;
      font-size: 13px;
    }

    .welcome h1 {
      margin: 5px 0 8px;
      font-size: 30px;
    }

    .welcome p {
      margin: 0;
      color: #d7eeeb;
      font-size: 14px;
    }

    .family-icon {
      width: 70px;
      height: 70px;
      border-radius: 22px;
      background: rgba(255,255,255,.13);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      flex-shrink: 0;
    }


    /* =========================
       PATIENT CARD
    ========================= */

    .patient-card {
      background: white;
      border: 1px solid #e3edeb;
      border-radius: 24px;
      padding: 28px;
      margin-bottom: 25px;
      box-shadow: 0 15px 40px rgba(22,70,65,.06);
    }

    .patient-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 25px;
    }

    .patient-avatar {
      width: 62px;
      height: 62px;
      border-radius: 19px;
      background: #e8f5f3;
      color: #16877d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 29px;
    }

    .patient-header h2 {
      color: #163b38;
      margin: 0 0 3px;
      font-size: 22px;
    }

    .patient-header p {
      margin: 0;
      color: #82938f;
      font-size: 13px;
    }


    /* =========================
       SUBSCRIPTION
    ========================= */

    .subscription {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .info-box {
      background: #f8fbfa;
      border: 1px solid #e5efed;
      border-radius: 17px;
      padding: 18px;
    }

    .info-box span {
      display: block;
      color: #849693;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .info-box strong {
      display: block;
      color: #163b38;
      font-size: 15px;
    }

    .active {
      color: #16877d !important;
    }


    /* =========================
       REMAINING DAYS
    ========================= */

    .remaining {
      margin-top: 18px;
      background: #eaf6f3;
      border-radius: 17px;
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .remaining-text strong {
      color: #163b38;
      font-size: 14px;
    }

    .remaining-text p {
      color: #718480;
      font-size: 11px;
      margin: 3px 0 0;
    }

    .days {
      color: #16877d;
      font-size: 24px;
      font-weight: 800;
    }


    /* =========================
       SECTION TITLE
    ========================= */

    .section-title {
      margin: 35px 0 18px;
    }

    .section-title h2 {
      color: #163b38;
      font-size: 23px;
      margin: 0 0 4px;
    }

    .section-title p {
      color: #7b8d89;
      font-size: 13px;
      margin: 0;
    }


    /* =========================
       SERVICES
    ========================= */

    .services-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .service {
      background: white;
      border: 1px solid #e3edeb;
      border-radius: 20px;
      padding: 20px;
      display: flex;
      align-items: flex-start;
      gap: 15px;
      box-shadow: 0 10px 30px rgba(22,70,65,.04);
      transition: .25s;
    }

    .service:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(22,70,65,.08);
    }

    .service-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #e8f5f3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .service-number {
      color: #a0b1ae;
      font-size: 11px;
      margin-bottom: 2px;
    }

    .service h3 {
      color: #163b38;
      font-size: 15px;
      margin: 0 0 4px;
    }

    .service p {
      color: #718480;
      font-size: 11px;
      line-height: 1.7;
      margin: 0;
    }


    /* =========================
       QUICK ACTIONS
    ========================= */

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .quick {
      background: white;
      border: 1px solid #e3edeb;
      border-radius: 20px;
      padding: 23px;
      text-decoration: none;
      text-align: center;
      transition: .25s;
    }

    .quick:hover {
      transform: translateY(-4px);
      border-color: #16877d;
      box-shadow: 0 15px 35px rgba(22,135,125,.08);
    }

    .quick-icon {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .quick strong {
      display: block;
      color: #163b38;
      font-size: 14px;
    }

    .quick span {
      display: block;
      color: #849693;
      font-size: 11px;
      margin-top: 4px;
    }


    /* =========================
       LOGOUT
    ========================= */

    .logout-area {
      text-align: center;
      margin-top: 40px;
    }

    .logout {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 11px 22px;
      border-radius: 13px;
      background: white;
      border: 1px solid #eadfdf;
      color: #9a5d5d;
      font-family: 'Cairo', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: .25s;
    }

    .logout:hover {
      background: #fff5f5;
      border-color: #d9bcbc;
      transform: translateY(-2px);
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      .dashboard {
        padding: 30px 5% 60px;
      }

      .welcome {
        padding: 25px;
        border-radius: 22px;
      }

      .welcome h1 {
        font-size: 24px;
      }

      .family-icon {
        width: 58px;
        height: 58px;
        font-size: 27px;
      }

      .subscription {
        grid-template-columns: 1fr 1fr;
      }

      .services-grid {
        grid-template-columns: 1fr;
      }

      .quick-grid {
        grid-template-columns: 1fr;
      }

    }


    @media (max-width: 520px) {

      .welcome-top {
        align-items: flex-start;
      }

      .welcome p {
        font-size: 12px;
      }

      .subscription {
        grid-template-columns: 1fr;
      }

      .remaining {
        align-items: flex-start;
      }

      .days {
        font-size: 21px;
      }

      .patient-card {
        padding: 20px;
      }

      .section-title h2 {
        font-size: 20px;
      }

    }

  </style>

</head>


<body>

       HEADER
  ========================= -->
