<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>لوحة العائلة | سند</title>

  <link rel="stylesheet" href="style.css">

  <style>

    body {
      background: linear-gradient(180deg, #f7fbfa, #eef7f5);
    }

    /* =========================
       DASHBOARD
    ========================= */

    .dashboard {
      max-width: 1180px;
      margin: auto;
      padding: 50px 6%;
    }


    /* =========================
       WELCOME
    ========================= */

    .welcome-card {
      background: white;
      border: 1px solid #e3edeb;
      border-radius: 28px;
      padding: 32px;
      margin-bottom: 24px;

      box-shadow:
        0 20px 60px rgba(22,70,65,.07);
    }

    .welcome-card .eyebrow {
      color: #16877d;
      font-weight: 800;
      font-size: 13px;
    }

    .welcome-card h1 {
      color: #163b38;
      font-size: 30px;
      margin: 8px 0;
    }

    .welcome-card p {
      color: #718480;
      margin: 0;
      line-height: 1.8;
    }


    /* =========================
       ELDER PROFILE
    ========================= */

    .profile-card {
      background: white;
      border: 1px solid #e3edeb;
      border-radius: 25px;
      padding: 28px;
      margin-bottom: 24px;

      box-shadow:
        0 18px 50px rgba(22,70,65,.06);
    }

    .section-title {
      color: #163b38;
      font-size: 21px;
      margin: 0 0 20px;
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 25px;
    }

    .elder-avatar {
      width: 72px;
      height: 72px;
      border-radius: 22px;

      background: #e8f5f3;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 35px;
      flex-shrink: 0;
    }

    .profile-top h2 {
      color: #163b38;
      margin: 0 0 5px;
      font-size: 23px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      color: #16877d;
      background: #e9f7f4;

      padding: 6px 11px;
      border-radius: 20px;

      font-size: 12px;
      font-weight: 800;
    }

    .profile-info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .info-box {
      background: #f8fcfb;
      border: 1px solid #e5efed;
      border-radius: 15px;
      padding: 16px;
    }

    .info-box span {
      display: block;
      color: #8a9b98;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .info-box strong {
      color: #163b38;
      font-size: 14px;
    }


    /* =========================
       SUBSCRIPTION
    ========================= */

    .subscription-card {
      background: linear-gradient(135deg, #16877d, #116e67);
      color: white;

      border-radius: 25px;
      padding: 28px;

      margin-bottom: 24px;

      box-shadow:
        0 18px 45px rgba(22,135,125,.18);
    }

    .subscription-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 22px;
    }

    .subscription-head h2 {
      margin: 0;
      font-size: 22px;
    }

    .package-badge {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.2);
      padding: 8px 13px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
    }

    .subscription-dates {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .date-box {
      background: rgba(255,255,255,.10);
      border-radius: 15px;
      padding: 15px;
    }

    .date-box span {
      display: block;
      font-size: 11px;
      opacity: .75;
      margin-bottom: 6px;
    }

    .date-box strong {
      font-size: 14px;
    }

    .remaining {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,.15);

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .remaining strong {
      font-size: 24px;
    }


    /* =========================
       CARE SERVICES
    ========================= */

    .care-card {
      background: white;
      border: 1px solid #e3edeb;
      border-radius: 25px;
      padding: 28px;
      margin-bottom: 24px;

      box-shadow:
        0 18px 50px rgba(22,70,65,.06);
    }

    .care-intro {
      color: #718480;
      font-size: 13px;
      margin-top: -10px;
      margin-bottom: 20px;
    }

    .service-list {
      display: grid;
      gap: 11px;
    }

    .service-item {
      display: flex;
      align-items: center;
      gap: 13px;

      background: #f8fcfb;
      border: 1px solid #e5efed;

      padding: 14px;
      border-radius: 15px;
    }

    .service-number {
      width: 30px;
      height: 30px;
      border-radius: 9px;

      background: #e8f5f3;
      color: #16877d;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 12px;
      font-weight: 900;

      flex-shrink: 0;
    }

    .service-icon {
      font-size: 21px;
    }

    .service-text {
      flex: 1;
    }

    .service-text strong {
      display: block;
      color: #163b38;
      font-size: 14px;
      margin-bottom: 3px;
    }

    .service-text span {
      color: #718480;
      font-size: 12px;
    }

    .optional {
      color: #b07819 !important;
    }
