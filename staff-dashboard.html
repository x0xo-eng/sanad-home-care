```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>لوحة الكادر | سند</title>

  <link rel="stylesheet" href="style.css">

  <style>

    body {
      background: linear-gradient(180deg, #f7fbfa, #eef7f5);
    }

    /* =========================
       DASHBOARD
    ========================= */

    .dashboard {
      max-width: 1250px;
      margin: auto;
      padding: 45px 6%;
    }


    /* =========================
       WELCOME
    ========================= */

    .welcome {
      background: white;
      border: 1px solid #e3edeb;
      border-radius: 26px;
      padding: 30px;
      margin-bottom: 25px;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;

      box-shadow: 0 18px 50px rgba(22,70,65,.07);
    }

    .welcome-text .eyebrow {
      color: #16877d;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 7px;
      display: block;
    }

    .welcome-text h1 {
      color: #163b38;
      font-size: 30px;
      margin: 0 0 8px;
    }

    .welcome-text p {
      color: #718480;
      margin: 0;
      line-height: 1.8;
    }

    .staff-avatar {
      width: 78px;
      height: 78px;
      border-radius: 24px;
      background: #e8f5f3;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 38px;
      flex-shrink: 0;
    }


    /* =========================
       QUICK STATS
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 28px;
    }

    .stat {
      background: white;
      border: 1px solid #e3edeb;
      border-radius: 20px;
      padding: 22px;

      box-shadow: 0 12px 35px rgba(22,70,65,.05);

      transition: .25s;
    }

    .stat:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 38px rgba(22,70,65,.08);
    }

    .stat-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .stat-icon {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: #e8f5f3;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 21px;
    }

    .stat-label {
      color: #718480;
      font-size: 13px;
    }

    .stat-number {
      color: #163b38;
      font-size: 28px;
      font-weight: 900;
    }


    /* =========================
       SECTION
    ========================= */

    .section {
      background: white;
      border: 1px solid #e3edeb;
      border-radius: 24px;
      padding: 28px;
      margin-bottom: 25px;

      box-shadow: 0 15px 45px rgba(22,70,65,.05);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 22px;
    }

    .section-header h2 {
      color: #163b38;
      font-size: 21px;
      margin: 0;
    }

    .section-header p {
      color: #718480;
      font-size: 13px;
      margin: 5px 0 0;
    }


    /* =========================
       VISITS
    ========================= */

    .visit-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .visit {
      display: grid;
      grid-template-columns: 100px 1fr auto;
      align-items: center;
      gap: 18px;

      padding: 18px;

      border: 1px solid #e4efed;
      border-radius: 17px;

      background: #fbfefe;

      transition: .25s;
    }

    .visit:hover {
      border-color: #16877d;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(22,135,125,.07);
    }

    .visit-time {
      color: #16877d;
      font-size: 15px;
      font-weight: 900;
    }

    .visit-info h3 {
      color: #163b38;
      font-size: 16px;
      margin: 0 0 5px;
    }

    .visit-info p {
      color: #718480;
      font-size: 12px;
      margin: 0;
    }


    /* =========================
       VISIT BUTTON
    ========================= */

    .visit-button {
      display: inline-block;

      margin-top: 10px;

      background: #16877d;
      color: white;

      border: none;
      border-radius: 10px;

      padding: 9px 15px;

      font-family: inherit;
      font-size: 12px;
      font-weight: 800;

      text-decoration: none;

      cursor: pointer;

      box-shadow: 0 7px 18px rgba(22,135,125,.12);

      transition: .25s;
    }

    .visit-button:hover {
      background: #0f7068;
      color: white;
      transform: translateY(-2px);

      box-shadow: 0 10px 22px rgba(22,135,125,.18);
    }


    /* =========================
       STATUS
    ========================= */

    .visit-status {
      padding: 7px 11px;
      border-radius: 9px;

      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status-pending {
      background: #fff5df;
      color: #a66a00;
    }

    .status-done {
      background: #e6f6ef;
      color: #16815f;
    }

    .status-current {
      background: #e8f5f3;
      color: #16877d;
    }


    /* =========================
       TWO COLUMNS
    ========================= */

    .two-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }


    /* =========================
       TASKS
    ========================= */

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 13px;

      padding: 15px;

      border-radius: 15px;
      background: #fbfefe;
      border: 1px solid #e5efed;

      transition: .25s;
    }

    .task:hover {
      border-color: #16877d;
      transform: translateY(-2px);
    }

    .task-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;

      background: #e8f5f3;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 20px;
      flex-shrink: 0;
    }

    .task-info {
      flex: 1;
    }

    .task-info h3 {
      color: #163b38;
      font-size: 14px;
      margin: 0 0 4px;
    }

    .task-info p {
      color: #718480;
      font-size: 11px;
      margin: 0;
    }


    /* =========================
       LAB
    ========================= */

    .lab-card {
      border: 1px solid #e3edeb;
      background: #fbfefe;
      border-radius: 17px;
      padding: 17px;
      margin-bottom: 12px;

      transition: .25s;
    }

    .lab-card:hover {
      border-color: #16877d;
      transform: translateY(-2px);
    }

    .lab-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .lab-name {
      color: #163b38;
      font-weight: 800;
      font-size: 14px;
    }

    .lab-date {
      color: #16877d;
      font-size: 12px;
      font-weight: 800;
    }

    .lab-card p {
      color: #718480;
      font-size: 12px;
      margin: 0;
      line-height: 1.7;
    }


    /* =========================
       REPORTS
    ========================= */

    .report-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .report-card {
      border: 1px solid #e3edeb;
      border-radius: 17px;
      padding: 20px;
      background: #fbfefe;
      text-align: center;

      transition: .25s;
    }

    .report-card:hover {
      border-color: #16877d;
      transform: translateY(-3px);
    }

    .report-card .report-icon {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .report-card h3 {
      color: #163b38;
      font-size: 14px;
      margin: 0 0 6px;
    }

    .report-card p {
      color: #718480;
      font-size: 11px;
      margin: 0;
      line-height: 1.7;
    }


    /* =========================
       PROFILE
    ========================= */

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .profile-item {
      padding: 16px;
      background: #fbfefe;
      border: 1px solid #e3edeb;
      border-radius: 15px;
    }

    .profile-item span {
      display: block;
      color: #718480;
      font-size: 11px;
      margin-bottom: 5px;
    }

    .profile-item strong {
      color: #163b38;
      font-size: 14px;
    }


    /* =========================
       LOGOUT
    ========================= */

    .logout-area {
      text-align: center;
      margin: 35px 0 10px;
    }

    .logout {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 11px 20px;

      border-radius: 12px;

      border: 1px solid #eadede;

      background: white;
      color: #a44b4b;

      text-decoration: none;

      font-size: 13px;
      font-weight: 800;

      transition: .25s;
    }

    .logout:hover {
      background: #a44b4b;
      color: white;
      transform: translateY(-2px);
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 900px) {

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .two-columns {
        grid-template-columns: 1fr;
      }

      .report-list {
        grid-template-columns: 1fr;
      }

      .profile-grid {
        grid-template-columns: 1fr 1fr;
      }

    }


    @media (max-width: 650px) {

      .dashboard {
        padding: 30px 5%;
      }

      .welcome {
        padding: 23px;
      }

      .welcome-text h1 {
        font-size: 24px;
      }

      .staff-avatar {
        width: 60px;
        height: 60px;
        border-radius: 18px;
        font-size: 29px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .stat {
        padding: 16px;
      }

      .stat-number {
        font-size: 23px;
      }

      .section {
        padding: 20px 15px;
        border-radius: 20px;
      }

      .visit {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .visit-status {
        width: fit-content;
      }

      .profile-grid {
        grid-template-columns: 1fr;
      }

    }


    @media (max-width: 420px) {

      .stats {
        grid-template-columns: 1fr;
      }

      .welcome {
        flex-direction: column;
        text-align: center;
      }

    }

  </style>

</head>
