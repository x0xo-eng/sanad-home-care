<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل دخول ذوي المسن | سند</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background: linear-gradient(180deg, #f7fbfa, #eef7f5);
    }

    .page {
      min-height: calc(100vh - 180px);
      padding: 60px 7%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .panel {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 18px;
      padding: 28px;
      border: 1px solid #e3edeb;
      box-shadow: 0 20px 50px rgba(22,70,65,.06);
    }

    .panel h1 {
      font-size: 26px;
      margin-bottom: 6px;
    }

    .lead {
      color: #718480;
      margin-bottom: 18px;
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    label {
      font-weight: 700;
      color: #163b38;
    }

    input[type="tel"],
    input[type="password"] {
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #e6f0ee;
      background: #fbfefe;
      font-size: 15px;
      width: 100%;
      box-sizing: border-box;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    .forgot {
      color: #16877d;
      font-weight: 700;
      text-decoration: none;
    }

    .btn-login {
      background: #16877d;
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 800;
      border: none;
      cursor: pointer;
    }

    .back {
      display: inline-block;
      margin-bottom: 12px;
      color: #16877d;
      font-weight: 700;
      text-decoration: none;
    }

    @media (max-width: 520px) {
      .panel {
        padding: 20px;
      }

      .page {
        padding: 30px 5%;
      }

      .actions {
        flex-direction: column;
        align-items: stretch;
      }

      .btn-login {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <a href="index.html" class="logo">سند<span>.</span></a>

  <nav class="nav">
    <a href="index.html">الرئيسية</a>
    <a href="services.html">خدماتنا</a>
    <a href="index.html#how">كيف يعمل سند؟</a>
    <a href="index.html#about">عن سند</a>
  </nav>

  <a href="login.html" class="login">تسجيل الدخول</a>
</header>

<main class="page">

  <div class="panel">

    <a href="login.html" class="back">← رجوع</a>

    <h1>تسجيل دخول ذوي المسن</h1>

    <p class="lead">
      سجل الدخول لمتابعة حالة المسن والتواصل مع فريق سند.
    </p>

    <form id="familyLoginForm">

      <div class="form-row">
        <label for="familyPhone">رقم الهاتف</label>

        <input
          id="familyPhone"
          type="tel"
          placeholder="أدخل رقم الهاتف"
          required
        >
      </div>

      <div class="form-row">
        <label for="familyPassword">كلمة المرور</label>

        <input
          id="familyPassword"
          type="password"
          placeholder="أدخل كلمة المرور"
          required
        >
      </div>

      <div class="actions">

        <a href="#" class="forgot">
          هل نسيت كلمة المرور؟
        </a>

        <button type="submit" class="btn-login">
          تسجيل الدخول
        </button>

      </div>

    </form>

  </div>

</main>

<footer>
  <div class="footer-logo">سند<span>.</span></div>
  <p>الرعاية المنزلية لكبار السن</p>
  <small>© 2026 سند — جميع الحقوق محفوظة</small>
</footer>

<script>
  document.getElementById("familyLoginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    alert("تسجيل الدخول الحقيقي سيتم تفعيله لاحقاً بعد ربط قاعدة البيانات.");
  });
</script>

</body>
</html>
