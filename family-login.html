<div class="panel">


  <div class="panel-header">

    <div class="panel-icon">
      👨‍👩‍👦
    </div>

    <h1>
      تسجيل دخول العائلة
    </h1>

    <p class="lead">
      سجل الدخول لمتابعة حالة المسن والتواصل مع فريق سند.
    </p>

  </div>


  <form id="familyLoginForm">


    <!-- PHONE -->

    <div class="form-row">

      <label for="familyPhone">
        رقم الهاتف
      </label>

      <input
        id="familyPhone"
        type="tel"
        placeholder="أدخل رقم الهاتف"
        autocomplete="tel"
        required
      >

    </div>


    <!-- PASSWORD -->

    <div class="form-row">

      <label for="familyPassword">
        كلمة المرور
      </label>

      <input
        id="familyPassword"
        type="password"
        placeholder="أدخل كلمة المرور"
        autocomplete="current-password"
        required
      >

    </div>


    <!-- ACTIONS -->

    <div class="actions">

      <a href="#" class="forgot">
        هل نسيت كلمة المرور؟
      </a>

      <button
        type="submit"
        class="btn-login"
      >
        تسجيل الدخول
      </button>

    </div>


  </form>


  <!-- BACK -->

  <a href="login.html" class="back">

    <span class="back-icon">
      ←

    <span>
      العودة لاختيار نوع الحساب
