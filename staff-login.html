```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل دخول الكادر | سند</title>

  <link rel="stylesheet" href="style.css">

  <style>

    body {
      background: linear-gradient(180deg, #f7fbfa, #eef7f5);
    }

    .page {
      min-height: calc(100vh - 180px);
      padding: 50px 6%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .panel {
      width: 100%;
      max-width: 900px;
      background: white;
      border-radius: 28px;
      padding: 38px;
      border: 1px solid #e3edeb;
      box-shadow: 0 25px 65px rgba(22,70,65,.09);
    }

    .panel-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .panel-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 16px;
      border-radius: 22px;
      background: #e8f5f3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    .panel-header h1 {
      color: #163b38;
      font-size: 30px;
      margin: 0 0 8px;
    }

    .panel-header p {
      color: #718480;
      font-size: 13px;
      margin: 0;
    }

    /* =========================
       ROLES
    ========================= */

    .roles-title {
      color: #163b38;
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .roles {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }

    .role {
      border: 1px solid #e3edeb;
      background: #fbfefe;
      border-radius: 15px;
      padding: 16px 8px;
      cursor: pointer;
      text-align: center;
      transition: .25s;
      font-family: inherit;
    }

    .role:hover {
      border-color: #16877d;
      transform: translateY(-2px);
    }

    .role.active {
      background: #e8f5f3;
      border-color: #16877d;
      box-shadow: 0 8px 20px rgba(22,135,125,.10);
    }

    .role-icon {
      font-size: 25px;
      margin-bottom: 7px;
    }

    .role-name {
      color: #163b38;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.6;
    }

    /* =========================
       LOGIN FORM
    ========================= */

    .login-box {
      display: none;
      border-top: 1px solid #e3edeb;
      padding-top: 25px;
    }

    .selected-role {
      text-align: center;
      color: #16877d;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 22px;
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 17px;
    }

    .form-row label {
      color: #163b38;
      font-size: 13px;
      font-weight: 800;
    }

    .form-row input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #dfecea;
      background: #fbfefe;
      color: #163b38;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    .form-row input:focus {
      border-color: #16877d;
      background: white;
      box-shadow: 0 0 0 4px rgba(22,135,125,.08);
    }

    .login-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-top: 22px;
    }

    .forgot {
      color: #16877d;
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
    }

    .btn-login {
      border: none;
      border-radius: 13px;
      padding: 13px 25px;
      background: #16877d;
      color: white;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-login:hover {
      background: #0f7068;
      transform: translateY(-2px);
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 11px;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
    }

    .error {
      background: #fff0f0;
      color: #a44b4b;
    }

    .back {
      display: flex;
      justify-content: center;
      margin-top: 25px;
      color: #16877d;
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
    }

    @media (max-width: 800px) {

      .roles {
        grid-template-columns: repeat(2, 1fr);
      }

      .panel {
        padding: 28px 20px;
      }

    }

    @media (max-width: 500px) {

      .login-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .btn-login {
        width: 100%;
      }

    }

  </style>

</head>

<body>

<header class="header">

  <a href="index.html" class="logo">
    سند<span>.</span>
  </a>

  <nav class="nav">

    <a href="index.html">الرئيسية</a>
    <a href="services.html">خدماتنا</a>
    <a href="how.html">كيف يعمل سند؟</a>
    <a href="about.html">عن سند</a>

  </nav>

</header>


<main class="page">

  <div class="panel">

    <div class="panel-header">

      <div class="panel-icon">
        👨‍⚕️
      </div>

      <h1>
        تسجيل دخول الكادر
      </h1>

      <p>
        اختر صفتك الوظيفية أولاً ثم أدخل بيانات حسابك
      </p>

    </div>


    <div class="roles-title">
      اختر الصفة الوظيفية
    </div>


    <div class="roles">


      <button class="role" onclick="selectRole('manager', '👔', 'مدير الشركة', this)">
        <div class="role-icon">👔</div>
        <div class="role-name">مدير الشركة</div>
      </button>


      <button class="role" onclick="selectRole('reception', '🧑‍💼', 'موظف الاستقبال', this)">
        <div class="role-icon">🧑‍💼</div>
        <div class="role-name">موظف الاستقبال</div>
      </button>


      <button class="role" onclick="selectRole('specialist', '👨‍⚕️', 'الطبيب الأخصائي', this)">
        <div class="role-icon">👨‍⚕️</div>
        <div class="role-name">الطبيب الأخصائي</div>
      </button>


      <button class="role" onclick="selectRole('resident', '🩺', 'الطبيب المقيم', this)">
        <div class="role-icon">🩺</div>
        <div class="role-name">الطبيب المقيم</div>
      </button>


      <button class="role" onclick="selectRole('nurse', '👩‍⚕️', 'الممرض الصحي', this)">
        <div class="role-icon">👩‍⚕️</div>
        <div class="role-name">الممرض الصحي</div>
      </button>


      <button class="role" onclick="selectRole('nutrition', '🥗', 'أخصائي التغذية', this)">
        <div class="role-icon">🥗</div>
        <div class="role-name">أخصائي التغذية</div>
      </button>


      <button class="role" onclick="selectRole('physio', '🦿', 'أخصائي العلاج الطبيعي', this)">
        <div class="role-icon">🦿</div>
        <div class="role-name">أخصائي العلاج الطبيعي</div>
      </button>


      <button class="role" onclick="selectRole('psychologist', '🧠', 'الأخصائي النفسي', this)">
        <div class="role-icon">🧠</div>
        <div class="role-name">الأخصائي النفسي</div>
      </button>


      <button class="role" onclick="selectRole('entertainment', '🎭', 'مرافق الترفيه', this)">
        <div class="role-icon">🎭</div>
        <div class="role-name">مرافق الترفيه</div>
      </button>


      <button class="role" onclick="selectRole('hairdresser', '💇', 'الكوافير', this)">
        <div class="role-icon">💇</div>
        <div class="role-name">الكوافير</div>
      </button>


    </div>


    <div class="login-box" id="loginBox">

      <div class="selected-role" id="selectedRole">
        —
      </div>


      <form id="staffLoginForm">

        <div class="form-row">

          <label for="staffPhone">
            رقم الهاتف
          </label>

          <input
            id="staffPhone"
            type="tel"
            placeholder="أدخل رقم الهاتف"
            autocomplete="tel"
            required
          >

        </div>


        <div class="form-row">

          <label for="staffPassword">
            كلمة المرور
          </label>

          <input
            id="staffPassword"
            type="password"
            placeholder="أدخل كلمة المرور"
            autocomplete="current-password"
            required
          >

        </div>


        <div class="login-actions">

          <a href="#" class="forgot" onclick="forgotPassword(event)">
            نسيت كلمة المرور؟
          </a>

          <button type="submit" class="btn-login">
            تسجيل الدخول
          </button>

        </div>

      </form>


      <div class="message error" id="errorMessage"></div>

    </div>


    <a href="login.html" class="back">

    </a>

  </div>

</main>


<footer>

  <div class="footer-logo">
    سند<span>.</span>
  </div>

  <p>
    الرعاية المنزلية لكبار السن
  </p>

  <small>
    © 2026 سند — جميع الحقوق محفوظة
  </small>

</footer>


<script>

let selectedRole = null;


/* =========================
   SELECT ROLE
========================= */

function selectRole(role, icon, name, element) {

  selectedRole = {
    role: role,
    icon: icon,
    name: name
  };


  document.querySelectorAll(".role").forEach(function(item) {
    item.classList.remove("active");
  });


  element.classList.add("active");


  document.getElementById("selectedRole").textContent =
    icon + "  " + name;


  document.getElementById("loginBox").style.display =
    "block";


  document.getElementById("staffPhone").focus();

}


/* =========================
   LOGIN
========================= */

document.getElementById("staffLoginForm").addEventListener(
  "submit",
  function(event) {

    event.preventDefault();


    if (!selectedRole) {
      return;
    }


    const phone =
      document.getElementById("staffPhone").value.trim();

    const password =
      document.getElementById("staffPassword").value;


    /*
      حسابات تجريبية مؤقتة
      إلى حين إنشاء قاعدة البيانات
    */

    const accounts = {

      manager: {
        phone: "07700000001",
        password: "1234",
        name: "مدير الشركة"
      },

      reception: {
        phone: "07700000002",
        password: "1234",
        name: "موظف الاستقبال"
      },

      specialist: {
        phone: "07700000003",
        password: "1234",
        name: "د. أحمد محمد"
      },

      resident: {
        phone: "07700000004",
        password: "1234",
        name: "د. علي محمد"
      },

      nurse: {
        phone: "07700000005",
        password: "1234",
        name: "الممرض الصحي"
      },

      nutrition: {
        phone: "07700000006",
        password: "1234",
        name: "أخصائي التغذية"
      },

      physio: {
        phone: "07700000007",
        password: "1234",
        name: "أخصائي العلاج الطبيعي"
      },

      psychologist: {
        phone: "07700000008",
        password: "1234",
        name: "الأخصائي النفسي"
      },

      entertainment: {
        phone: "07700000009",
        password: "1234",
        name: "مرافق الترفيه"
      },

      hairdresser: {
        phone: "07700000010",
        password: "1234",
        name: "الكوافير"
      }

    };


    const account =
      accounts[selectedRole.role];


    if (
      phone !== account.phone ||
      password !== account.password
    ) {

      const error =
        document.getElementById("errorMessage");

      error.textContent =
        "❌ بيانات الحساب غير صحيحة. تأكد من الصفة ورقم الهاتف وكلمة المرور.";

      error.style.display = "block";

      return;

    }


    /*
      حفظ بيانات الموظف الحالي
    */

    const currentStaff = {

      role: selectedRole.role,

      roleName: selectedRole.name,

      icon: selectedRole.icon,

      name: account.name,

      phone: account.phone,

      loggedInAt: new Date().toISOString()

    };


    localStorage.setItem(
      "sanadCurrentStaff",
      JSON.stringify(currentStaff)
    );


    /*
      فتح لوحة الكادر
    */

    window.location.href =
      "staff-dashboard.html";

  }
);


/* =========================
   FORGOT PASSWORD
========================= */

function forgotPassword(event) {

  event.preventDefault();

  alert(
    "استعادة كلمة المرور عبر واتساب سيتم تفعيلها لاحقاً عند ربط النظام بقاعدة البيانات وواتساب."
  );

}

</script>


</body>

</html>
