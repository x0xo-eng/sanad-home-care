<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل دخول الكادر | سند</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:linear-gradient(180deg,#f7fbfa,#eef7f5);
}

.login-page{
min-height:calc(100vh - 180px);
padding:55px 7%;
display:flex;
justify-content:center;
align-items:center;
}

.login-container{
width:100%;
max-width:1000px;
background:white;
border-radius:28px;
padding:42px;
box-shadow:0 25px 70px rgba(22,70,65,.09);
border:1px solid #e3edeb;
}

.login-header{
text-align:center;
margin-bottom:30px;
}

.eyebrow{
display:block;
color:#16877d;
font-size:13px;
font-weight:800;
margin-bottom:8px;
}

.login-header h1{
color:#163b38;
font-size:34px;
margin:0 0 8px;
}

.login-header p{
color:#718480;
font-size:14px;
margin:0;
}

.roles-title{
color:#163b38;
font-size:17px;
font-weight:800;
margin-bottom:15px;
}

.roles{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:13px;
margin-bottom:28px;
}

.role{
border:1.5px solid #e3edeb;
background:#fbfefe;
border-radius:17px;
padding:17px 10px;
min-height:115px;
cursor:pointer;
text-align:center;
font-family:inherit;
transition:.25s;
}

.role:hover{
border-color:#16877d;
transform:translateY(-3px);
}

.role.active{
background:#e8f5f3;
border-color:#16877d;
box-shadow:0 8px 22px rgba(22,135,125,.12);
}

.role-icon{
font-size:28px;
margin-bottom:8px;
}

.role-name{
display:block;
color:#163b38;
font-size:12px;
font-weight:800;
line-height:1.5;
}

.form-box{
border-top:1px solid #e3edeb;
padding-top:28px;
}

.selected-role{
background:#f0f8f6;
border:1px solid #dcece9;
border-radius:13px;
padding:12px 15px;
color:#16877d;
font-size:13px;
font-weight:800;
margin-bottom:20px;
text-align:center;
}

.form-row{
display:flex;
flex-direction:column;
gap:8px;
margin-bottom:17px;
}

.form-row label{
color:#163b38;
font-size:13px;
font-weight:800;
}

.form-row input{
width:100%;
box-sizing:border-box;
padding:14px;
border-radius:12px;
border:1px solid #dfecea;
background:#fbfefe;
color:#163b38;
font-family:inherit;
font-size:14px;
outline:none;
}

.form-row input:focus{
border-color:#16877d;
background:white;
box-shadow:0 0 0 4px rgba(22,135,125,.08);
}

.actions{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
margin-top:23px;
}

.forgot{
color:#16877d;
font-size:12px;
font-weight:800;
text-decoration:none;
}

.btn-login{
border:none;
border-radius:13px;
padding:13px 28px;
background:#16877d;
color:white;
font-family:inherit;
font-size:13px;
font-weight:800;
cursor:pointer;
}

.btn-login:hover{
background:#0f7068;
}

.error,
.success{
display:none;
margin-top:15px;
padding:12px;
border-radius:11px;
text-align:center;
font-size:12px;
font-weight:800;
}

.error{
background:#fff0f0;
color:#a44b4b;
border:1px solid #f0dada;
}

.success{
background:#e6f6ef;
color:#16815f;
}

.back-home{
display:flex;
width:fit-content;
margin:28px auto 0;
color:#16877d;
text-decoration:none;
font-size:12px;
font-weight:800;
}

@media(max-width:900px){

.roles{
grid-template-columns:repeat(3,1fr);
}

}

@media(max-width:650px){

.login-page{
padding:30px 5%;
}

.login-container{
padding:28px 20px;
}

.roles{
grid-template-columns:repeat(2,1fr);
}

.actions{
flex-direction:column;
align-items:stretch;
}

.btn-login{
width:100%;
}

.forgot{
text-align:center;
}

}

</style>

</head>


<body>


<header class="header">

<a href="index.html" class="logo">
سند<span>.</span>
</a>

<nav class="nav">

<a href="index.html">الرئيسية</a>
<a href="services.html">خدماتنا</a>
<a href="how.html">كيف يعمل سند؟</a>
<a href="about.html">عن سند</a>

</nav>

</header>


<main class="login-page">

<div class="login-container">


<div class="login-header">

<span class="eyebrow">
🏥 نظام الكادر — سند
</span>

<h1>
تسجيل دخول الكادر
</h1>

<p>

</p>

</div>

</div>


<div class="roles">


<button

>

</button>

class="role"
onclick="selectRole('manager',this)"
>

</div>

<span class="role-name">
مدير الشركة
</span>

</button>


<button
type="button"
class="role"
onclick="selectRole('reception',this)"
>

<div class="role-icon">

</div>

<span class="role-name">
موظف الاستقبال
</span>

</button>


<button
type="button"
class="role"
onclick="selectRole('specialist',this)"
>

<div class="role-icon">

</div>

<span class="role-name">

</span>

</button>


<button
type="button"
class="role"
onclick="selectRole('resident',this)"
>

<div class="role-icon">
🩺
</div>

<span class="role-name">

</span>

</button>


<button
type="button"
class="role"
onclick="selectRole('nurse',this)"
>

<div class="role-icon">

</div>

<span class="role-name">
الممرض الصحي
</span>

</button>


<button
type="button"
class="role"
onclick="selectRole('nutrition',this)"
>

<div class="role-icon">
🥗
</div>

<span class="role-name">
أخصائي التغذية
</span>

</button>


<button
type="button"
class="role"
onclick="selectRole('physio',this)"
>

<div class="role-icon">
🏃
</div>

<span class="role-name">
أخصائي العلاج الطبيعي
</span>

</button>


<button
type="button"
class="role"
onclick="selectRole('psychologist',this)"
>

<div class="role-icon">
🧠
</div>

<span class="role-name">
الأخصائي النفسي
</span>

</button>


<button
type="button"
class="role"
onclick="selectRole('entertainment',this)"
>

<div class="role-icon">
🎭
</div>

<span class="role-name">
مرافق الترفيه
</span>

</button>


<button
type="button"
class="role"
onclick="selectRole('hairdresser',this)"
>

<div class="role-icon">
💇
</div>

<span class="role-name">
الكوافير
</span>

</button>


</div>


<div class="form-box">


<div
class="selected-role"
id="selectedRole"
>

⚠️ يرجى اختيار الصفة الوظيفية أولاً

</div>


<form id="staffLoginForm">


<div class="form-row">

<label for="staffPhone">
📱 رقم الهاتف
</label>

<input
id="staffPhone"
type="tel"
placeholder="أدخل رقم الهاتف"
autocomplete="tel"
required
>

</div>


<div class="form-row">

<label for="staffPassword">
🔐 كلمة المرور
</label>

<input
id="staffPassword"
type="password"
placeholder="أدخل كلمة المرور"
autocomplete="current-password"
required
>

</div>


<div class="actions">


<a
href="#"
class="forgot"
onclick="forgotPassword(event)"
>
نسيت كلمة المرور؟
</a>


<button
type="submit"
class="btn-login"
>
تسجيل الدخول
</button>


</div>


<div
id="errorMessage"
class="error"
></div>


<div
id="successMessage"
class="success"
></div>


</form>


</div>


<a
href="login.html"
class="back-home"
>
← العودة إلى اختيار نوع الحساب
</a>


</div>

</main>


<footer>

<div class="footer-logo">
سند<span>.</span>
</div>

<p>
الرعاية المنزلية لكبار السن
</p>

<small>
© 2026 سند — جميع الحقوق محفوظة
</small>

</footer>


<script>


/*
====================================================
حسابات الكادر
====================================================

staffId
هو المعرف الأساسي والثابت لكل موظف.

هذا المعرف هو الذي سنستخدمه لاحقاً في:

لوحة المدير
      ↓
إنشاء الموعد
      ↓
assignedStaffId
      ↓
localStorage
      ↓
لوحة الكادر
      ↓
staffId
      ↓
عرض الموعد

====================================================
*/


const staffAccounts=[


/* مالك النظام */

{
phone:"07700000001",
password:"123456",

role:"owner",

name:"منتظر",

title:"مالك النظام",

staffId:"OWNER-001",

/*
نبقي employeeId للتوافق مع الأكواد القديمة
*/

employeeId:"OWNER-001",

dashboard:"owner-dashboard.html",

permissions:["all"]
},


/* مدير الشركة */

{
phone:"07700000002",
password:"123456",

role:"manager",

name:"مدير الشركة",

title:"مدير الشركة",

staffId:"ST-002",

employeeId:"ST-002",

dashboard:"manager-dashboard.html",

permissions:[
"customers",
"packages",
"approvals",
"reports"
]
},


/* موظف الاستقبال */

{
phone:"07700000003",
password:"123456",

role:"reception",

name:"موظف الاستقبال",

title:"موظف الاستقبال",

staffId:"ST-003",

employeeId:"ST-003",

dashboard:"reception-dashboard.html",

permissions:[
"packages",
"new_customer",
"customers",
"payments"
]
},


/* الطبيب الأخصائي */

{
phone:"07700000004",
password:"123456",

role:"specialist",

name:"د. محمد",

title:"طبيب أخصائي",

staffId:"ST-004",

employeeId:"ST-004",

dashboard:"staff-dashboard.html",

permissions:[
"medical_specialist"
]
},


/* الطبيب المقيم */

{
phone:"07700000005",
password:"123456",

role:"resident",

name:"د. أحمد",

title:"طبيب مقيم",

staffId:"ST-005",

employeeId:"ST-005",

dashboard:"staff-dashboard.html",

permissions:[
"medical_resident"
]
},


/* الممرض الصحي */

{
phone:"07700000006",
password:"123456",

role:"nurse",

name:"ممرض سند",

title:"الممرض الصحي",

staffId:"ST-006",

employeeId:"ST-006",

dashboard:"staff-dashboard.html",

permissions:[
"nursing"
]
},


/* أخصائي التغذية */

{
phone:"07700000007",
password:"123456",

role:"nutrition",

name:"أخصائي التغذية",

title:"أخصائي التغذية",

staffId:"ST-007",

employeeId:"ST-007",

dashboard:"staff-dashboard.html",

permissions:[
"nutrition"
]
},


/* أخصائي العلاج الطبيعي */

{
phone:"07700000008",
password:"123456",

role:"physio",

name:"أخصائي العلاج الطبيعي",

title:"أخصائي العلاج الطبيعي",

staffId:"ST-008",

employeeId:"ST-008",

dashboard:"staff-dashboard.html",

permissions:[
"physio"
]
},


/* الأخصائي النفسي */

{
phone:"07700000009",
password:"123456",

role:"psychologist",

name:"الأخصائي النفسي",

title:"الأخصائي النفسي",

staffId:"ST-009",

employeeId:"ST-009",

dashboard:"staff-dashboard.html",

permissions:[
"psychology"
]
},


/* مرافق الترفيه */

{
phone:"07700000010",

password:"123456",

role:"entertainment",

name:"مرافق سند",

title:"مرافق الترفيه",

staffId:"ST-010",

employeeId:"ST-010",

dashboard:"staff-dashboard.html",

permissions:[
"entertainment"
]
},


/* الكوافير */

{
phone:"07700000011",

password:"123456",

role:"hairdresser",

name:"كوافير سند",

title:"الكوافير",

staffId:"ST-011",

employeeId:"ST-011",

dashboard:"staff-dashboard.html",

permissions:[
"hairdresser"
]
}


];


let selectedRole=null;


/*
====================================================
اختيار الصفة الوظيفية
====================================================
*/

function selectRole(role,element){

selectedRole=role;


/* إزالة التحديد السابق */

document
.querySelectorAll(".role")
.forEach(function(button){

button.classList.remove("active");

});


/* تحديد الزر الحالي */

element.classList.add("active");


/* البحث عن الحساب */

const account=
staffAccounts.find(function(item){

return item.role===role;

});


if(account){

document
.getElementById("selectedRole")
.textContent=
"✅ الصفة المختارة: "+account.title;

}

}


/*
====================================================
تسجيل الدخول
====================================================
*/

document
.getElementById("staffLoginForm")
.addEventListener(
"submit",
function(event){

event.preventDefault();

hideMessages();


const phone=
document
.getElementById("staffPhone")
.value
.trim();


const password=
document
.getElementById("staffPassword")
.value
.trim();


/*
التأكد من اختيار الصفة
*/

if(!selectedRole){

showError(
"يرجى اختيار الصفة الوظيفية أولاً."
);

return;

}


/*
البحث عن حساب الموظف
*/

const account=
staffAccounts.find(function(item){

return(
item.phone===phone &&
item.password===password &&
item.role===selectedRole
);

});


/*
إذا كانت البيانات خاطئة
*/

if(!account){

showError(
"رقم الهاتف أو كلمة المرور غير صحيحة لهذه الصفة."
);

return;

}


/*
====================================================
إنشاء جلسة الموظف
====================================================

مهم جداً:

staffId هو الهوية الأساسية.

مثلاً:

الممرض:
ST-006

هذا الرقم سيبقى نفسه في:

staff-login.html
manager-dashboard.html
staff-dashboard.html
المواعيد
localStorage

====================================================
*/


const loggedInStaff={

/* بيانات الاتصال */

phone:account.phone,

/* الصفة */

role:account.role,

/* الاسم */

name:account.name,

/* المسمى الوظيفي */

title:account.title,

/*
المعرف الأساسي الجديد
*/

staffId:account.staffId,

/*
المعرف القديم يبقى موجوداً
حتى لا ينكسر أي كود سابق
*/

employeeId:account.employeeId,

/* الصلاحيات */

permissions:account.permissions,

/* لوحة التحكم */

dashboard:account.dashboard,

/* وقت تسجيل الدخول */

loginTime:new Date().toISOString()

};


/*
====================================================
حذف الجلسة القديمة
====================================================
*/

localStorage.removeItem(
"sanadLoggedInStaff"
);

localStorage.removeItem(
"sanadStaffId"
);

localStorage.removeItem(
"sanadStaffName"
);

localStorage.removeItem(
"sanadStaffRole"
);


/*
====================================================
حفظ جلسة الموظف
====================================================
*/

localStorage.setItem(
"sanadLoggedInStaff",
JSON.stringify(loggedInStaff)
);


/*
====================================================
حفظ staffId بشكل مستقل
====================================================

هذا مهم حتى تستطيع أي لوحة
قراءة هوية الموظف بسهولة.

مثلاً:

const staffId =
localStorage.getItem("sanadStaffId");

====================================================
*/

localStorage.setItem(
"sanadStaffId",
account.staffId
);


/*
حفظ الاسم
*/

localStorage.setItem(
"sanadStaffName",
account.name
);


/*
حفظ المسمى الوظيفي
*/

localStorage.setItem(
"sanadStaffRole",
account.title
);


/*
رسالة نجاح
*/

showSuccess(
"✅ تم تسجيل الدخول بنجاح..."
);


/*
الانتقال إلى لوحة الموظف
*/

setTimeout(function(){

window.location.href=
account.dashboard;

},500);

});


/*
====================================================
عرض رسالة الخطأ
====================================================
*/

function showError(message){

const error=
document.getElementById(
"errorMessage"
);

error.textContent=message;

error.style.display="block";

}


/*
====================================================
عرض رسالة النجاح
====================================================
*/

function showSuccess(message){

const success=
document.getElementById(
"successMessage"
);

success.textContent=message;

success.style.display="block";

}


/*
====================================================
إخفاء الرسائل
====================================================
*/

function hideMessages(){

document.getElementById(
"errorMessage"
).style.display="none";


document.getElementById(
"successMessage"
).style.display="none";

}


/*
====================================================
نسيت كلمة المرور
====================================================
*/

function forgotPassword(event){

event.preventDefault();


if(!selectedRole){

showError(
"اختر الصفة الوظيفية أولاً."
);

return;

}


alert(
"سيتم لاحقاً ربط استعادة كلمة المرور بواتساب وإدارة النظام."
);

}


</script>

</body>

</html>
