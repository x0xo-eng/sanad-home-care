<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل دخول الكادر | سند</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:linear-gradient(180deg,#f7fbfa,#eef7f5);
}

.login-page{
min-height:calc(100vh - 180px);
padding:55px 7%;
display:flex;
justify-content:center;
align-items:center;
}

.login-container{
width:100%;
max-width:1000px;
background:white;
border-radius:28px;
padding:42px;
box-shadow:0 25px 70px rgba(22,70,65,.09);
border:1px solid #e3edeb;
}

.login-header{
text-align:center;
margin-bottom:30px;
}

.eyebrow{
display:block;
color:#16877d;
font-size:13px;
font-weight:800;
margin-bottom:8px;
}

.login-header h1{
color:#163b38;
font-size:34px;
margin:0 0 8px;
}

.login-header p{
color:#718480;
font-size:14px;
margin:0;
}

.roles-title{
color:#163b38;
font-size:17px;
font-weight:800;
margin-bottom:15px;
}

.roles{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:13px;
margin-bottom:28px;
}

.role{
border:1.5px solid #e3edeb;
background:#fbfefe;
border-radius:17px;
padding:17px 10px;
min-height:115px;
cursor:pointer;
text-align:center;
font-family:inherit;
transition:.25s;
}

.role:hover{
border-color:#16877d;
transform:translateY(-3px);
}

.role.active{
background:#e8f5f3;
border-color:#16877d;
box-shadow:0 8px 22px rgba(22,135,125,.12);
}

.role-icon{
font-size:28px;
margin-bottom:8px;
}

.role-name{
display:block;
color:#163b38;
font-size:12px;
font-weight:800;
line-height:1.5;
}

.form-box{
border-top:1px solid #e3edeb;
padding-top:28px;
}

.selected-role{
background:#f0f8f6;
border:1px solid #dcece9;
border-radius:13px;
padding:12px 15px;
color:#16877d;
font-size:13px;
font-weight:800;
margin-bottom:20px;
text-align:center;
}

.form-row{
display:flex;
flex-direction:column;
gap:8px;
margin-bottom:17px;
}

.form-row label{
color:#163b38;
font-size:13px;
font-weight:800;
}

.form-row input{
width:100%;
box-sizing:border-box;
padding:14px;
border-radius:12px;
border:1px solid #dfecea;
background:#fbfefe;
color:#163b38;
font-family:inherit;
font-size:14px;
outline:none;
}

.form-row input:focus{
border-color:#16877d;
background:white;
box-shadow:0 0 0 4px rgba(22,135,125,.08);
}

.actions{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
margin-top:23px;
}

.forgot{
color:#16877d;
font-size:12px;
font-weight:800;
text-decoration:none;
}

.btn-login{
border:none;
border-radius:13px;
padding:13px 28px;
background:#16877d;
color:white;
font-family:inherit;
font-size:13px;
font-weight:800;
cursor:pointer;
}

.btn-login:hover{
background:#0f7068;
}

.error,
.success{
display:none;
margin-top:15px;
padding:12px;
border-radius:11px;
text-align:center;
font-size:12px;
font-weight:800;
}

.error{
background:#fff0f0;
color:#a44b4b;
border:1px solid #f0dada;
}

.success{
background:#e6f6ef;
color:#16815f;
}

.back-home{
display:flex;
width:fit-content;
margin:28px auto 0;
color:#16877d;
text-decoration:none;
font-size:12px;
font-weight:800;
}

@media(max-width:900px){

.roles{
grid-template-columns:repeat(3,1fr);
}

}

@media(max-width:650px){

.login-page{
padding:30px 5%;
}

.login-container{
padding:28px 20px;
}

.roles{
grid-template-columns:repeat(2,1fr);
}

.actions{
flex-direction:column;
align-items:stretch;
}

.btn-login{
width:100%;
}

.forgot{
text-align:center;
}

}

</style>

</head>


<body>

<a href="index.html" class="logo">
سند<span>.</span>
</a>

<nav class="nav">

تسجيل دخول الكادر

<button
type="button"

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sanad-db.js"></script>

<script>


/* =========================================================
   خريطة الأدوار: اسم الصفة الظاهر + الأيقونة + اللوحة

   ملاحظة مهمة: "owner" يروح لنفس manager-dashboard.html
   (مو لصفحة owner-dashboard.html منفصلة) لأن لوحة المدير
   أصلاً مبرمجة تتعرف على المالك وتعطيه صلاحيات كاملة زيادة
========================================================= */

const SANAD_ROLE_INFO = {
  owner:         { title: "مالك النظام",        dashboard: "manager-dashboard.html" },
  manager:       { title: "مدير الشركة",         dashboard: "manager-dashboard.html" },
  reception:     { title: "موظف استقبال",        dashboard: "reception-dashboard.html" },
  specialist:    { title: "طبيب أخصائي",         dashboard: "staff-dashboard.html" },
  resident:      { title: "طبيب مقيم",           dashboard: "staff-dashboard.html" },
  nurse:         { title: "ممرض صحي",            dashboard: "staff-dashboard.html" },
  nutrition:     { title: "أخصائي تغذية",        dashboard: "staff-dashboard.html" },
  physio:        { title: "أخصائي علاج طبيعي",   dashboard: "staff-dashboard.html" },
  psychologist:  { title: "أخصائي نفسي",         dashboard: "staff-dashboard.html" },
  entertainment: { title: "أخصائي ترفيه",        dashboard: "staff-dashboard.html" },
  hairdresser:   { title: "كوافير",              dashboard: "staff-dashboard.html" },
  assistant:     { title: "معين",                dashboard: "staff-dashboard.html" }
};


let selectedRole = null;


/*
====================================================
اختيار الصفة الوظيفية
====================================================
*/

function selectRole(role, element) {

  selectedRole = role;

  document
    .querySelectorAll(".role")
    .forEach(function(button) {
      button.classList.remove("active");
    });

  element.classList.add("active");

  const info = SANAD_ROLE_INFO[role];

  if (info) {
    document.getElementById("selectedRole").textContent =
      "✅ الصفة المختارة: " + info.title;
  }

}


/*
====================================================
تسجيل الدخول (يتحقق من قاعدة البيانات الحقيقية)
====================================================
*/

document
  .getElementById("staffLoginForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    hideMessages();

    const phone =
      document.getElementById("staffPhone").value.trim();

    const password =
      document.getElementById("staffPassword").value.trim();

    if (!selectedRole) {
      showError("يرجى اختيار الصفة الوظيفية أولاً.");
      return;
    }

    const button =
      event.target.querySelector("button[type=submit]");

    const originalText = button.textContent;
    button.textContent = "جارِ التحقق...";
    button.disabled = true;

    const result = await sanadLoginStaff(phone, password);

    button.textContent = originalText;
    button.disabled = false;

    if (!result.success) {
      showError(result.message);
      return;
    }

    if (result.staff.role !== selectedRole) {
      showError("رقم الهاتف أو كلمة المرور غير صحيحة لهذه الصفة.");
      return;
    }

    const info = SANAD_ROLE_INFO[result.staff.role] || {};

    const loggedInStaff = {
      phone: result.staff.phone,
      role: result.staff.role,
      name: result.staff.name,
      title: info.title || result.staff.role,
      staffId: result.staff.id,
      employeeId: result.staff.staff_code,
      dashboard: info.dashboard || "staff-dashboard.html",
      loginTime: new Date().toISOString()
    };

    sanadSaveSession("staff", result.staff);

    localStorage.removeItem("sanadLoggedInStaff");
    localStorage.removeItem("sanadStaffId");
    localStorage.removeItem("sanadStaffName");
    localStorage.removeItem("sanadStaffRole");

    localStorage.setItem("sanadLoggedInStaff", JSON.stringify(loggedInStaff));
    localStorage.setItem("sanadStaffId", loggedInStaff.staffId);
    localStorage.setItem("sanadStaffName", loggedInStaff.name);
    localStorage.setItem("sanadStaffRole", loggedInStaff.title);

    showSuccess("✅ تم تسجيل الدخول بنجاح...");

    setTimeout(function() {
      window.location.href = loggedInStaff.dashboard;
    }, 500);

  });


/*
====================================================
عرض رسالة الخطأ
====================================================
*/

function showError(message) {
  const error = document.getElementById("errorMessage");
  error.textContent = message;
  error.style.display = "block";
}


/*
====================================================
عرض رسالة النجاح
====================================================
*/

function showSuccess(message) {
  const success = document.getElementById("successMessage");
  success.textContent = message;
  success.style.display = "block";
}


/*
====================================================
إخفاء الرسائل
====================================================
*/

function hideMessages() {
  document.getElementById("errorMessage").style.display = "none";
  document.getElementById("successMessage").style.display = "none";
}


/*
====================================================
نسيت كلمة المرور
====================================================
*/

function forgotPassword(event) {

  event.preventDefault();

  if (!selectedRole) {
    showError("اختر الصفة الوظيفية أولاً.");
    return;
  }

  alert("سيتم لاحقاً ربط استعادة كلمة المرور بواتساب وإدارة النظام.");

}


</script>
